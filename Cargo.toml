[package]
name = "bevy_symbios_avatar"
version = "0.1.0"
edition = "2024"
authors = ["Janus"]
description = "Bevy integration for parametric avatars on atproto."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/bevy_symbios_avatar"
keywords = ["avatar", "procedural", "generative", "bevy", "atproto"]
categories = ["game-development", "graphics"]

[features]
default = ["editor"]
# The record editor, and the only reason anything but bevy and the engine is in
# this tree. It is severable on purpose: a consumer that only wants to *draw* a
# body should not inherit a GUI toolkit, and `default-features = false` is how
# they say so.
editor = ["dep:bevy_egui", "dep:serde_json"]
# Carries the engine's baked CC0 clip set in the binary.
#
# **Off by default, for the same reason it is off upstream.** The artifact is
# 200 KiB, and a consumer that only draws bodies should not pay for motion it
# never plays — least of all a wasm one, where a linked build measured 210 KiB
# larger with it and 125 KiB larger gzipped. A consumer that fetches `clips.bin`
# at run time inserts its own `Clips` resource and pays nothing here.
builtin-clips = ["symbios-avatar/builtin-clips"]

[[example]]
name = "viewer"
# The two windows are most of what this example is for now, so it does not build
# without them — and the clip picker is not a picker with nothing to pick.
required-features = ["editor", "builtin-clips"]

[dependencies]
bevy = "0.18"

# A path dependency on purpose, and for as long as the engine is pre-release.
# This crate exists to be a *second instrument* on the same body: if the two
# ever read a different version of the engine they stop being comparable, which
# is the one thing it is here to do.
symbios-avatar = "0.1"

# The first dependency beyond bevy and the engine, and it is deliberate rather
# than accidental. Judging a body has been a slow loop — change a constant,
# rebuild, render four fixed angles, hand over a picture — and it cannot answer
# what an axis does across its *range*, which is the question the open geometry
# issues are stuck on. A live panel can.
#
# Pinned to the pair known to work against Bevy 0.18 rather than to whatever is
# latest, which is how the sibling project that uses it daily runs.
bevy_egui = { version = "0.39", optional = true }
# Emitting the record is the half that makes the panel worth more than a set of
# sliders, and JSON is what a PDS holds. The engine already depends on this at
# the same version, so it is not a new crate in the tree.
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
# The viewer example only. The library holds no opinion about the scene a body
# stands in and that includes the camera, so an orbit camera has no business in
# its dependency tree — but the example is where a body is actually looked at,
# and it should be looked at with the same hands as the sibling application.
#
# Its own "bevy_egui" feature is deliberately OFF, which is that application's
# finding rather than a guess: the gate it provides is all-or-nothing and
# privately scheduled, so a right-drag died the moment it crossed a GUI window.
# `gate_camera_on_gui` in the example owns the equivalent, with a held-button
# override.
bevy_panorbit_camera = "0.34"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# A Bevy system takes its parameters by value; that is the contract, not an
# oversight, and there is no way to write one that satisfies this lint.
needless_pass_by_value = "allow"
